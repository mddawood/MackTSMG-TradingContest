<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MWM Trading Championship 2026</title>
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Main Style Sheet -->
    <link rel="stylesheet" href="index.css">
    <!-- Modular ES6 Application Logic -->
    <script type="module" src="js/app.js"></script>
</head>
<body class="dark-theme">
    <!-- Sticky Header -->
    <header class="main-header">
        <div class="container flex-row justify-between align-center h-16">
            <a href="/" class="logo flex-row align-center gap-2" id="nav-logo" data-link>
                <span class="logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>
                </span>
                MWM
            </a>
            <nav class="nav-links flex-row gap-6" id="public-nav">
                <a href="#how" class="nav-link">How it works</a>
                <a href="#prizes" class="nav-link">Prizes</a>
                <a href="#tiers" class="nav-link">Tiers</a>
                <a href="#leaderboard-section" class="nav-link">Leaderboard</a>
            </nav>
            <div class="auth-ctas flex-row gap-3" id="nav-auth-buttons">
                <button class="btn btn-ghost" id="login-nav-btn">Log in</button>
                <button class="btn btn-primary" id="join-nav-btn">Join Championship</button>
            </div>
            <!-- Auth Nav Controls (hidden by default) -->
            <div class="auth-controls flex-row align-center gap-4 hidden" id="nav-user-controls">
                <span class="user-greeting" id="user-greeting">Welcome, User</span>
                <button class="btn btn-secondary" id="dashboard-nav-btn">Dashboard</button>
                <button class="btn btn-secondary hidden" id="admin-nav-btn" style="border-color: rgba(37, 99, 235, 0.4); color: #60a5fa;">Admin Panel</button>
                <button class="btn btn-primary hidden" id="admin-create-comp-btn">Create Competition</button>
                <button class="btn btn-ghost" id="logout-btn">Log out</button>
            </div>
            
            <!-- Hamburger menu button for mobile -->
            <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle Menu">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" x2="21" y1="12" y2="12"></line><line x1="3" x2="21" y1="6" y2="6"></line><line x1="3" x2="21" y1="18" y2="18"></line></svg>
            </button>
        </div>
    </header>

    <!-- Mobile Menu Drawer Overlay -->
    <div id="mobile-menu-drawer" class="mobile-drawer hidden">
        <div class="mobile-drawer-content flex-column gap-6">
            <div class="flex-row justify-between align-center pb-4 border-bottom" style="border-bottom: 1px solid rgba(255, 255, 255, 0.08);">
                <span class="logo flex-row align-center gap-2">
                    <span class="logo-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>
                    </span>
                    MWM
                </span>
                <button class="mobile-drawer-close" id="mobile-menu-close-btn" aria-label="Close Menu">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="6" y1="6" y2="18"></line><line x1="6" x2="18" y1="6" y2="18"></line></svg>
                </button>
            </div>
            
            <!-- Public Navigation Links inside Drawer -->
            <nav class="mobile-nav-links flex-column gap-2" id="mobile-public-nav">
                <a href="#how" class="mobile-nav-link flex-row align-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-secondary);"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
                    How it works
                </a>
                <a href="#prizes" class="mobile-nav-link flex-row align-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-secondary);"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>
                    Prizes
                </a>
                <a href="#tiers" class="mobile-nav-link flex-row align-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-secondary);"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>
                    Tiers
                </a>
                <a href="#leaderboard-section" class="mobile-nav-link flex-row align-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-secondary);"><path d="M3 3v16a2 2 0 0 0 2 2h16"></path><path d="M18 17V9"></path><path d="M13 17V5"></path><path d="M8 17v-3"></path></svg>
                    Leaderboard
                </a>
            </nav>
            
            <div class="border-top pt-4 flex-column gap-4" style="border-top: 1px solid rgba(255, 255, 255, 0.08);">
                <!-- Auth CTAs inside Drawer -->
                <div class="mobile-auth-ctas flex-column gap-3" id="mobile-nav-auth-buttons">
                    <button class="btn btn-secondary w-full flex-row align-center justify-center gap-2" id="mobile-login-nav-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" x2="3" y1="12" y2="12"></line></svg>
                        Log in
                    </button>
                    <button class="btn btn-primary w-full flex-row align-center justify-center gap-2" id="mobile-join-nav-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" x2="19" y1="8" y2="14"></line><line x1="22" x2="16" y1="11" y2="11"></line></svg>
                        Join Championship
                    </button>
                </div>
                
                <!-- Auth Controls inside Drawer (hidden by default) -->
                <div class="mobile-auth-controls flex-column gap-4 hidden" id="mobile-nav-user-controls">
                    <!-- User Profile Card -->
                    <div class="mobile-user-card flex-row align-center gap-3">
                        <div class="user-avatar flex-row align-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary" style="color: #60a5fa;"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        </div>
                        <div class="flex-column" style="overflow: hidden;">
                            <span class="user-card-name" id="mobile-user-greeting">Trader</span>
                            <span class="user-card-role" id="mobile-user-role-badge">Trader</span>
                        </div>
                    </div>
                    
                    <div class="flex-column gap-2">
                        <button class="btn btn-secondary w-full flex-row align-center justify-start gap-3" id="mobile-dashboard-nav-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"></rect><rect width="7" height="5" x="14" y="3" rx="1"></rect><rect width="7" height="9" x="14" y="10" rx="1"></rect><rect width="7" height="5" x="3" y="16" rx="1"></rect></svg>
                            Dashboard
                        </button>
                        <button class="btn btn-secondary w-full hidden flex-row align-center justify-start gap-3" id="mobile-admin-nav-btn" style="border-color: rgba(37, 99, 235, 0.3); color: #60a5fa;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            Admin Panel
                        </button>
                        <button class="btn btn-primary w-full hidden flex-row align-center justify-start gap-3" id="mobile-admin-create-comp-btn" style="background: linear-gradient(135deg, var(--primary) 0%, #3b82f6 100%); border: none;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
                            Create Competition
                        </button>
                        <button class="btn btn-ghost w-full flex-row align-center justify-start gap-3 mt-4" id="mobile-logout-btn" style="color: #f87171; background: rgba(239, 68, 68, 0.07); border: 1px solid rgba(239, 68, 68, 0.15);">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" x2="9" y1="12" y2="12"></line></svg>
                            Log out
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Dynamic Main View Mount Point -->
    <main class="main-content" id="app-view">
        <!-- Rendered dynamically by Client-Side Router -->
    </main>

    <!-- Footer -->
    <footer class="main-footer border-top py-8">
        <div class="container flex-row justify-between align-center flex-wrap gap-4">
            <p class="footer-text">© 2026 MWM Trading Championship. Built in partnership with Delta Exchange.</p>
            <div class="footer-links flex-row gap-4">
                <a href="#how" class="footer-link">Rules</a>
                <a href="#leaderboard-section" class="footer-link">Live Leaderboard</a>
                <a href="#" class="footer-link">Terms & Conditions</a>
            </div>
        </div>
    </footer>

    <!-- AUTH MODAL -->
    <div id="auth-modal" class="modal-overlay hidden">
        <div class="modal-box glass">
            <button class="modal-close-btn" id="modal-close-btn">&times;</button>
            <div class="modal-tabs flex-row">
                <button class="modal-tab-btn active" id="tab-login-btn">Log In</button>
                <button class="modal-tab-btn" id="tab-register-btn">Sign Up</button>
            </div>
            
            <!-- Login Form -->
            <form id="login-form" class="modal-form flex-column gap-4 py-4">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" class="form-control" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-full mt-2">Log In</button>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="modal-form flex-column gap-4 py-4 hidden">
                <div class="form-group">
                    <label for="register-name">Full Name</label>
                    <input type="text" id="register-name" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Email Address</label>
                    <input type="email" id="register-email" class="form-control" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" class="form-control" placeholder="Min. 6 characters" minlength="6" required>
                </div>
                <div class="form-group">
                    <label for="register-delta-id">Delta User ID</label>
                    <input type="text" id="register-delta-id" class="form-control" placeholder="Enter your Delta User ID (referred only)" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-full mt-2">Create Account</button>
            </form>
        </div>
    </div>

    <!-- CREATE COMPETITION MODAL -->
    <div id="comp-modal" class="modal-overlay hidden">
        <div class="modal-box glass" style="max-width: 500px;">
            <button class="modal-close-btn" id="comp-modal-close-btn">&times;</button>
            <h2 class="card-title flex-row align-center gap-2 mb-4" style="font-size: 1.5rem; justify-content: center;">
                🏆 Launch New Competition
            </h2>
            <form id="admin-comp-form-modal" class="flex-column gap-4 py-2">
                <div class="form-group">
                    <label for="modal-comp-title">Competition Title</label>
                    <input type="text" id="modal-comp-title" class="form-control" placeholder="e.g. Weekly Sprint - Week 2" required>
                </div>
                <div class="form-group">
                    <label for="modal-comp-desc">Description</label>
                    <textarea id="modal-comp-desc" class="form-control" placeholder="Championship rules, terms & requirements..." rows="3" required style="resize: none;"></textarea>
                </div>
                <div class="form-group">
                    <label for="modal-comp-start">Start Time (UTC)</label>
                    <input type="datetime-local" id="modal-comp-start" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="modal-comp-end">End Time (UTC)</label>
                    <input type="datetime-local" id="modal-comp-end" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-full mt-2" id="modal-comp-submit-btn">Launch Competition</button>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast-notification" class="toast hidden">
        <span id="toast-message">Message text goes here</span>
    </div>
</body>
</html>
