services:
  # --------------------
  # Backend API Service
  # --------------------
  - type: web
    name: mack-trading-contest-backend
    runtime: python
    repo: https://github.com/mddawood/MackTSMG-TradingContest
    branch: QA
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/delta_competition.db
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.8

  # --------------------
  # Frontend Static Service
  # --------------------
  - type: web
    name: mack-trading-contest-frontend
    runtime: static
    repo: https://github.com/mddawood/MackTSMG-TradingContest
    branch: QA
    rootDir: frontend
    buildCommand: echo "{\"API_URL\":\"https://$API_URL\"}" > config.json
    staticPublishPath: .
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: mack-trading-contest-backend
          property: host
