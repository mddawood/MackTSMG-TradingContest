services:
  # --------------------
  # QA Environment
  # --------------------
  - type: web
    name: mack-trading-contest-backend-qa
    runtime: python
    repo: https://github.com/mddawood/MackTSMG-TradingContest
    branch: QA
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: sqlite-data-qa
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/delta_competition.db
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false

  - type: web
    name: mack-trading-contest-frontend-qa
    runtime: static
    repo: https://github.com/mddawood/MackTSMG-TradingContest
    branch: QA
    rootDir: frontend
    buildCommand: echo "{\"API_URL\":\"https://$API_URL\"}" > config.json
    staticPublishPath: .
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: mack-trading-contest-backend-qa
          property: host

  # --------------------
  # Production Environment
  # --------------------
  - type: web
    name: mack-trading-contest-backend-prod
    runtime: python
    repo: https://github.com/mddawood/MackTSMG-TradingContest
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: sqlite-data-prod
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/delta_competition.db
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false

  - type: web
    name: mack-trading-contest-frontend-prod
    runtime: static
    repo: https://github.com/mddawood/MackTSMG-TradingContest
    branch: main
    rootDir: frontend
    buildCommand: echo "{\"API_URL\":\"https://$API_URL\"}" > config.json
    staticPublishPath: .
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: mack-trading-contest-backend-prod
          property: host
